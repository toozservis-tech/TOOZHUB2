<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administrace – Evidence Vozidel</title><style>[hidden]{display:none!important}body{font:17px system-ui;background:#102d31;color:#e1f5ef;margin:0;display:grid;min-height:100vh;place-items:center}main{max-width:420px;padding:32px}label{display:block;margin-top:20px}input,button,a{box-sizing:border-box;font:inherit}input,button{width:100%;padding:14px;margin-top:8px;border-radius:10px;border:1px solid #67988e}button{background:#bdeee0;color:#102d31;margin-top:24px;cursor:pointer}a{color:#bdeee0}p{line-height:1.5}#error{color:#ffb5b5}</style></head><body><main><h1>Evidence Vozidel</h1><p>Webové rozhraní je určené pouze administrátorům. Uživatelé a servisy pokračují v mobilní aplikaci.</p><aside id="logoutNotice" role="status" hidden><p id="logoutMessage"></p><button id="retryLogout" type="button">Zopakovat potvrzení odhlášení</button></aside><form id="form"><label>E-mail administrátora<input id="email" type="email" autocomplete="username" required></label><label id="passwordLabel">Heslo<input id="password" type="password" autocomplete="current-password" required></label><label id="codeLabel" hidden>Ověřovací kód<input id="code" inputmode="numeric" autocomplete="one-time-code"></label><div id="setup" hidden><p>V autentikátoru přidejte účet Evidence Vozidel pomocí klíče níže. Zvolte časový kód. Klíč nikomu neposílejte; nastavení dokončete do 10 minut.</p><p id="secret" style="overflow-wrap:anywhere;font-family:monospace"></p></div><button id="submit">Přihlásit administrátora</button></form><button id="restart" type="button" hidden>Začít přihlášení znovu</button><p id="error" role="alert"></p><a href="spravavozidel://login">Otevřít mobilní aplikaci</a></main><script src="/admin-session.js"></script>
<script src="/admin-login.js"></script></body></html>
