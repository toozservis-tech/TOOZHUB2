<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administrace – Správa vozidel</title><style>[hidden]{display:none!important}body{font:17px system-ui;background:#102d31;color:#e1f5ef;margin:0;display:grid;min-height:100vh;place-items:center}main{max-width:420px;padding:32px}label{display:block;margin-top:20px}input,button,a{box-sizing:border-box;font:inherit}input,button{width:100%;padding:14px;margin-top:8px;border-radius:10px;border:1px solid #67988e}button{background:#bdeee0;color:#102d31;margin-top:24px;cursor:pointer}a{color:#bdeee0}p{line-height:1.5}#error{color:#ffb5b5}</style></head><body><main><h1>Správa vozidel</h1><p>Webové rozhraní je určené pouze administrátorům. Uživatelé a servisy pokračují v mobilní aplikaci.</p><form id="form"><label>E-mail administrátora<input id="email" type="email" autocomplete="username" required></label><label>Heslo<input id="password" type="password" autocomplete="current-password" required></label><label id="codeLabel" hidden>Ověřovací kód<input id="code" inputmode="numeric" autocomplete="one-time-code"></label><button id="submit">Přihlásit administrátora</button></form><p id="error" role="alert"></p><a href="spravavozidel://login">Otevřít mobilní aplikaci</a></main><script>
let challenge=null;
const form=document.getElementById('form'), button=document.getElementById('submit');
async function post(url,body,token){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:'Přihlášení se nezdařilo.');return data;}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;document.getElementById('error').textContent='';try{
const data=challenge?await post('/user/login/2fa',{challenge_token:challenge,code:document.getElementById('code').value}):await post('/user/login',{email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
if(data.two_factor_required){challenge=data.challenge_token;document.getElementById('codeLabel').hidden=false;document.getElementById('code').required=true;document.getElementById('code').focus();return;}
await post('/admin-web-session',{},data.access_token);
localStorage.setItem('adminAccessToken',data.access_token);localStorage.setItem('adminRole',data.user.role);form.reset();location.replace('/web_admin/');
}catch(e){document.getElementById('error').textContent=e.message;}finally{button.disabled=false;}});
</script></body></html>
