name: Service photo permissions
on:
  push:
    paths: ['web/service-features.js', 'web/job-timeline.js', 'src/server/web_access.py', 'tests/web/job-evidence-policy.cjs', 'tests/web/service-job-timeline.cjs', 'tests/fixtures/service-job-timeline*.json', '.github/workflows/service-photo-contract.yml']
  pull_request:
    paths: ['web/service-features.js', 'web/job-timeline.js', 'src/server/web_access.py', 'tests/web/job-evidence-policy.cjs', 'tests/web/service-job-timeline.cjs', 'tests/fixtures/service-job-timeline*.json', '.github/workflows/service-photo-contract.yml']
  workflow_dispatch:
jobs:
  permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/web/job-evidence-policy.cjs
      - run: node --check web/job-timeline.js && node --check web/service-features.js
      - run: node --test tests/web/service-job-timeline.cjs
