name: Service Reception Gate

on:
  push:
    paths:
      - 'src/modules/vehicle_hub/**'
      - 'scripts/migrate_service_job_photos.py'
      - 'scripts/migrate_mobile_release.py'
      - 'tests/api/test_reservation_workshop_flow.py'
      - 'tests/api/test_service_jobs.py'
      - 'tests/api/test_mobile_release_migration.py'
      - '.github/workflows/service-reception-gate.yml'
  pull_request:
    paths:
      - 'src/modules/vehicle_hub/**'
      - 'scripts/migrate_service_job_photos.py'
      - 'scripts/migrate_mobile_release.py'
      - 'tests/api/test_reservation_workshop_flow.py'
      - '.github/workflows/service-reception-gate.yml'
  workflow_dispatch:

jobs:
  reception:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./test_vehicles.db
      VEHICLE_DB_URL: sqlite:///./test_vehicles.db
      TEST_DATABASE_URL: sqlite:///./test_vehicles.db
      JWT_SECRET_KEY: test-secret-key-for-ci-only
      ENABLE_IP_GEOLOOKUP: '0'
      ENABLE_REVERSE_GEOCODE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-server.txt pytest httpx
      - name: Test booking lifecycle, photos and database migration
        run: |
          python -m pytest tests/api/test_reservation_workshop_flow.py tests/api/test_service_jobs.py tests/api/test_mobile_release_migration.py -q --tb=short
