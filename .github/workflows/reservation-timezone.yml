name: Reservation timezone contract
on:
  push:
    paths: ['src/modules/vehicle_hub/**', 'web/legacy-app.js', 'tests/api/test_reservation_email_timezone.py', 'tests/web/reservation-timezone.cjs', '.github/workflows/reservation-timezone.yml']
  pull_request:
    paths: ['src/modules/vehicle_hub/**', 'web/legacy-app.js', 'tests/api/test_reservation_email_timezone.py', 'tests/web/reservation-timezone.cjs', '.github/workflows/reservation-timezone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timezone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./test_vehicles.db
      VEHICLE_DB_URL: sqlite:///./test_vehicles.db
      JWT_SECRET_KEY: test-secret-key-for-ci-only
      SMTP_HOST: ''
      SMTP_USER: ''
      SMTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements-server.txt pytest httpx
      - run: python -m pytest tests/api/test_reservation_email_timezone.py tests/api/test_reservation_service_routing.py -q
      - run: node tests/web/reservation-timezone.cjs
