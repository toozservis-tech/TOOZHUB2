<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overeni e-mailu - Sprava vozidel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background:
                radial-gradient(circle at 20% 0%, rgba(220, 38, 38, 0.16), transparent 34%),
                radial-gradient(circle at 80% 10%, rgba(15, 23, 42, 0.18), transparent 34%),
                #f8fafc;
            color: #0f172a;
        }

        .verify-card {
            width: min(100%, 520px);
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
            padding: 34px;
            text-align: center;
        }

        .brand-logo {
            width: 108px;
            height: 108px;
            object-fit: contain;
            margin: 0 auto 18px;
            display: block;
        }

        h1 {
            font-size: clamp(1.55rem, 4vw, 2.05rem);
            line-height: 1.15;
            margin-bottom: 12px;
            letter-spacing: 0;
        }

        .lead {
            color: #475569;
            font-size: 1rem;
            line-height: 1.55;
            margin: 0 auto 22px;
            max-width: 38rem;
        }

        .status {
            border-radius: 12px;
            padding: 14px 16px;
            margin: 18px 0;
            font-weight: 600;
            line-height: 1.45;
        }

        .status.info {
            color: #1d4ed8;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
        }

        .status.success {
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        .status.error {
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 22px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 11px 18px;
            border-radius: 10px;
            border: 1px solid transparent;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(15, 23, 42, 0.12);
        }

        .btn-primary {
            color: #ffffff;
            background: #dc2626;
        }

        .btn-secondary {
            color: #334155;
            background: #ffffff;
            border-color: #cbd5e1;
        }

        .btn[hidden] {
            display: none;
        }

        .small-note {
            color: #64748b;
            font-size: 0.88rem;
            line-height: 1.45;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <main class="verify-card" aria-live="polite">
        <img class="brand-logo" src="/web/assets/landing/sprava-vozidel-logo.jpeg" alt="Sprava vozidel">
        <h1>Ov&ecaron;ren&iacute; e-mailu</h1>
        <p class="lead">Dokon&ccaron;ujeme aktivaci va&scaron;eho &uacute;&ccaron;tu. Tato akce trv&aacute; jen okam&zcaron;ik.</p>

        <div id="status" class="status info">Ov&ecaron;&rcaron;uji odkaz z e-mailu...</div>

        <div class="actions">
            <a id="loginLink" class="btn btn-primary" href="/login" hidden>Pokracovat na prihlaseni</a>
            <a class="btn btn-secondary" href="/">Zpet na uvodni stranku</a>
        </div>

        <p class="small-note">
            Pokud odkaz vypr&scaron;el, otev&rcaron;ete p&rcaron;ihl&aacute;&scaron;en&iacute; a po&zcaron;&aacute;dejte o nov&yacute; ov&ecaron;&rcaron;ovac&iacute; e-mail.
        </p>
    </main>

    <script>
        (function () {
            const statusEl = document.getElementById("status");
            const loginLink = document.getElementById("loginLink");
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");

            function setStatus(message, type) {
                statusEl.textContent = message;
                statusEl.className = "status " + type;
            }

            async function verifyEmail() {
                if (!token) {
                    setStatus("Chybi overovaci token. Pouzijte prosim odkaz z e-mailu.", "error");
                    return;
                }

                try {
                    const response = await fetch("/user/verify-email", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ token: token }),
                    });
                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        setStatus(data.detail || data.message || "Odkaz se nepodarilo overit.", "error");
                        return;
                    }

                    setStatus(data.message || "E-mail byl overen. Nyni se muzete prihlasit.", "success");
                    loginLink.hidden = false;
                } catch (error) {
                    setStatus("Overeni se nepodarilo kvuli chybe pripojeni. Zkuste to prosim znovu.", "error");
                }
            }

            verifyEmail();
        })();
    </script>
</body>
</html>
