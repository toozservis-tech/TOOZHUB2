<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Veřejná historie vozidla</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f141b;
      --panel: #19212b;
      --panel-soft: #202b38;
      --text: #f8fafc;
      --muted: rgba(226, 232, 240, 0.72);
      --line: rgba(148, 163, 184, 0.18);
      --primary: #4b82ff;
      --ok: #22c55e;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef2f8;
        --panel: #ffffff;
        --panel-soft: #f8fafc;
        --text: #0f172a;
        --muted: rgba(51, 65, 85, 0.76);
        --line: rgba(15, 23, 42, 0.1);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page {
      width: min(820px, 100%);
      margin: 0 auto;
      padding: 18px 14px calc(24px + env(safe-area-inset-bottom));
      display: grid;
      gap: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.16);
    }
    .hero h1, .card h2, .card h3 { margin: 0 0 8px; }
    .muted { color: var(--muted); }
    .grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--text);
      font-weight: 700;
      font-size: 0.92rem;
    }
    .record {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: 16px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }
    .record-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .service {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .empty {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
    }
    .cta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      appearance: none;
      border: 0;
      border-radius: 14px;
      min-height: 46px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      color: #eff6ff;
      background: linear-gradient(135deg, var(--primary), #255ef0);
    }
    .btn.secondary {
      color: var(--text);
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }
    .ok { color: var(--ok); }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .record-head { align-items: start; flex-direction: column; }
      .cta-row { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="page" id="app">
    <section class="card hero">
      <h1>Veřejná historie vozidla</h1>
      <p class="muted">Načítám veřejnou servisní historii…</p>
    </section>
  </main>
  <script>
    function fmtDate(value) {
      if (!value) return 'Neuvedeno';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleDateString('cs-CZ');
    }

    function fmtDateTime(value) {
      if (!value) return 'Neuvedeno';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return String(value);
      return d.toLocaleString('cs-CZ');
    }

    function fmtMoney(value) {
      if (value == null || value === '') return 'Neuvedeno';
      const n = Number(value);
      if (!Number.isFinite(n)) return String(value);
      return `${n.toLocaleString('cs-CZ')} Kč`;
    }

    function tokenFromLocation() {
      const params = new URLSearchParams(window.location.search);
      return params.get('token') || '';
    }

    /** Základ URL backendu: nastavte při deployi např. window.__API_BASE__ = 'https://hub.example.cz' (bez koncového /). */
    function resolvePublicApiBaseUrl() {
      try {
        const raw = typeof window !== 'undefined' ? window.__API_BASE__ : '';
        return String(raw || '').trim().replace(/\/+$/, '');
      } catch (e) {
        return '';
      }
    }

    function publicVehicleHistoryFetchUrl(token) {
      const path = `/api/public/vehicle-history/${encodeURIComponent(token)}`;
      const base = resolvePublicApiBaseUrl();
      if (!base) return path;
      return `${base}${path}`;
    }

    async function sharePage() {
      if (!navigator.share) return;
      await navigator.share({
        title: 'Veřejná historie vozidla',
        url: window.location.href,
      });
    }

    async function boot() {
      const app = document.getElementById('app');
      const token = tokenFromLocation();
      if (!token) {
        app.innerHTML = '<section class="card"><h1>Chybí token</h1><p class="muted">Odkaz veřejné historie je neplatný.</p></section>';
        return;
      }

      try {
        const response = await fetch(publicVehicleHistoryFetchUrl(token));
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload?.detail || 'Veřejnou historii se nepodařilo načíst.');
        }
        const records = Array.isArray(payload.records) ? payload.records : [];
        app.innerHTML = `
          <section class="card hero">
            <div class="pill">${payload.public_mode === 'full' ? 'Plný veřejný režim' : payload.public_mode === 'verified' ? 'Ověřený veřejný režim' : 'Základní veřejný režim'}</div>
            <h1>${payload.vehicle_label || 'Vozidlo'}</h1>
            <p class="muted">VIN: ${payload.vin || 'Neuvedeno'}</p>
            <div class="grid">
              <div class="card">
                <h3>Technické údaje</h3>
                <p class="muted">Rok výroby: ${payload.year || 'Neuvedeno'}</p>
                <p class="muted">Motor: ${payload.engine || 'Neuvedeno'}</p>
              </div>
              <div class="card">
                <h3>Doporučený další servis</h3>
                <p>${payload.recommended_next_service_text || 'Zatím bez doporučení.'}</p>
                <p class="muted">Termín: ${fmtDate(payload.recommended_next_service_date)}</p>
              </div>
            </div>
            <div class="cta-row">
              ${navigator.share ? '<button class="btn" id="shareBtn">Sdílet odkaz</button>' : ''}
              <button class="btn secondary" onclick="window.print()">Tisk</button>
            </div>
          </section>
          <section class="card">
            <h2>Servisní historie</h2>
            ${records.length ? records.map((record) => `
              <article class="record">
                <div class="record-head">
                  <div>
                    <strong>${record.category || 'Servisní záznam'}</strong>
                    <div class="muted">${fmtDateTime(record.performed_at)}</div>
                  </div>
                  <div class="pill">${record.record_status || 'submitted'}</div>
                </div>
                <div class="service">
                  <span>Servis: <strong>${record.service_identity?.name || 'Neuvedeno'}</strong></span>
                  <span>${record.service_identity?.verified_status ? '<span class="ok">Ověřený servis</span>' : 'Neověřený servis'}</span>
                  <span>IČO: ${record.service_identity?.ico || 'Neuvedeno'}</span>
                </div>
                <div class="grid">
                  <div><strong>Nájezd</strong><div class="muted">${record.mileage != null ? `${Number(record.mileage).toLocaleString('cs-CZ')} km` : 'Neuvedeno'}</div></div>
                  <div><strong>Cena</strong><div class="muted">${fmtMoney(record.total_price)}</div></div>
                </div>
                ${record.description ? `<div><strong>Popis</strong><div class="muted">${record.description}</div></div>` : ''}
                ${record.service_type ? `<div><strong>Typ servisu</strong><div class="muted">${record.service_type}</div></div>` : ''}
                ${record.recommended_next_service_text ? `<div><strong>Další servis</strong><div class="muted">${record.recommended_next_service_text}</div></div>` : ''}
                ${record.recommended_next_service_date ? `<div><strong>Doporučený termín</strong><div class="muted">${fmtDate(record.recommended_next_service_date)}</div></div>` : ''}
                ${record.notes_customer_visible ? `<div><strong>Poznámka pro zákazníka</strong><div class="muted">${record.notes_customer_visible}</div></div>` : ''}
                ${record.public_quote_url ? `<div class="cta-row"><a class="btn secondary" href="${record.public_quote_url}">Zobrazit nabídku</a></div>` : ''}
              </article>
            `).join('') : '<div class="empty">Ve veřejné historii zatím nejsou publikované žádné důvěryhodné servisní záznamy.</div>'}
          </section>
        `;
        const shareBtn = document.getElementById('shareBtn');
        if (shareBtn) {
          shareBtn.addEventListener('click', () => sharePage().catch(() => {}));
        }
      } catch (error) {
        app.innerHTML = `
          <section class="card">
            <h1>Historii se nepodařilo načíst</h1>
            <p class="muted">${String(error?.message || error)}</p>
          </section>
        `;
      }
    }

    boot();
  </script>
</body>
</html>
